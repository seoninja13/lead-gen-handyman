<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brave Search MCP Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        .search-form {
            margin-bottom: 20px;
        }
        .search-input {
            width: 70%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .search-button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .search-button:hover {
            background-color: #3367d6;
        }
        .results {
            margin-top: 20px;
        }
        .result {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .result h3 {
            margin-top: 0;
            margin-bottom: 5px;
        }
        .result a {
            color: #1a0dab;
            text-decoration: none;
        }
        .result a:hover {
            text-decoration: underline;
        }
        .result .url {
            color: #006621;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .result .description {
            color: #545454;
            font-size: 14px;
            line-height: 1.4;
        }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .error {
            color: red;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Brave Search MCP Test</h1>
        
        <div class="search-form">
            <input type="text" id="search-input" class="search-input" placeholder="Enter your search query...">
            <button id="search-button" class="search-button">Search</button>
        </div>
        
        <div id="error" class="error"></div>
        
        <div id="loading" class="loading">
            <p>Searching...</p>
        </div>
        
        <div id="results" class="results"></div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchButton = document.getElementById('search-button');
            const resultsContainer = document.getElementById('results');
            const loadingElement = document.getElementById('loading');
            const errorElement = document.getElementById('error');
            
            // Function to perform search
            async function performSearch(query) {
                // Show loading indicator
                loadingElement.style.display = 'block';
                resultsContainer.innerHTML = '';
                errorElement.style.display = 'none';
                
                try {
                    // Make request to Brave Search MCP server
                    const response = await fetch('http://localhost:8888/mcp4_brave_search', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ query, count: 10 })
                    });
                    
                    // Check for errors
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP error ${response.status}: ${errorText}`);
                    }
                    
                    // Parse response
                    const data = await response.json();
                    
                    // Display results
                    if (data.results && data.results.length > 0) {
                        // Create results HTML
                        const resultsHTML = data.results.map(result => `
                            <div class="result">
                                <h3><a href="${result.url}" target="_blank">${result.title}</a></h3>
                                <div class="url">${result.url}</div>
                                <div class="description">${result.description}</div>
                            </div>
                        `).join('');
                        
                        // Add total count
                        const totalHTML = `<p>Found ${data.total} results. Showing top ${data.results.length}:</p>`;
                        
                        // Update results container
                        resultsContainer.innerHTML = totalHTML + resultsHTML;
                    } else {
                        resultsContainer.innerHTML = '<p>No results found.</p>';
                    }
                } catch (error) {
                    // Display error
                    errorElement.textContent = `Error: ${error.message}`;
                    errorElement.style.display = 'block';
                    console.error('Search error:', error);
                } finally {
                    // Hide loading indicator
                    loadingElement.style.display = 'none';
                }
            }
            
            // Handle search button click
            searchButton.addEventListener('click', function() {
                const query = searchInput.value.trim();
                if (query) {
                    performSearch(query);
                }
            });
            
            // Handle Enter key press
            searchInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    const query = searchInput.value.trim();
                    if (query) {
                        performSearch(query);
                    }
                }
            });
        });
    </script>
</body>
</html>
